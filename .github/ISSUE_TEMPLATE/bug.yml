name: Bug report
description: Something in pi-ask-user-enhanced behaves differently from ENHANCED.md or the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This tracker is for the enhanced fork. If the bug also happens with upstream `npm:pi-ask-user`, it may belong upstream at https://github.com/edlsh/pi-ask-user/issues. Check that it still happens on the latest release, and remove private question or answer content before pasting.
  - type: input
    id: version
    attributes:
      label: pi-ask-user-enhanced version (shown at the bottom of the prompt)
      placeholder: "0.17.2-enhanced.1.4.1"
    validations:
      required: true
  - type: input
    id: pi
    attributes:
      label: Pi host and version
      placeholder: "pi 1.0.2"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: "kitty 0.43, macOS 26"
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display mode
      options: [overlay, inline, adaptive, fullscreen, not sure]
    validations:
      required: true
  - type: textarea
    id: args
    attributes:
      label: Tool arguments
      description: The ask_user call that triggered the bug, plus any PI_ASK_USER_* env vars or ask-user.json settings.
      render: json
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
    validations:
      required: true
